[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context"
version = "0.1.0"
description = "长程智能体上下文压缩：可验证压缩与计划感知策略"
requires-python = ">=3.11"
dependencies = ["tiktoken>=0.7"]

[project.scripts]
agent-context = "agent_context.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_context*"]